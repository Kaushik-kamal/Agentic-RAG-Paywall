[project]
name = "agentic-rag-paywall"
version = "2.0.0"
description = "A pay-per-query knowledge API for autonomous agents, settled on Stellar via HTTP 402."
requires-python = ">=3.11"
license = { text = "MIT" }

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q --strict-markers"
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::UserWarning",
]

[tool.ruff]
line-length = 92
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "C4", "RUF"]
ignore = [
    "E501",   # line length is handled by the formatter
    "B008",   # FastAPI's Depends()/File() defaults are idiomatic
    "RUF012", # mutable class attrs are fine for pydantic models
    # Citation breadcrumbs ("Doc › Section › p.4") intentionally use a
    # typographic separator; RUF001 flags it as ambiguous with ">".
    "RUF001",
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E402", "SLF001"]
"scripts/*" = ["E402", "T201"]

[tool.ruff.lint.isort]
known-first-party = ["app"]
